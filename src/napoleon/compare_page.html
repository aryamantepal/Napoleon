<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napoleon comparison</title>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #dddbd4; --accent: #2f5fd0;
          --c0: #2f5fd0; --c1: #c0392b; --c2: #2e7d32; --c3: #b9770e; --c4: #8e44ad; --c5: #117a8b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --panel: #201f1d; --text: #ecebe6; --muted: #a09e97; --line: #3a3935; --accent: #7aa2ff;
            --c0: #7aa2ff; --c1: #ff7b6b; --c2: #81c784; --c3: #ffb84d; --c4: #c39bd3; --c5: #5fd0e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; gap: 16px; padding: 16px; max-width: 1100px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; overflow-x: auto; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  #chart { width: 100%; height: 280px; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-top: 6px; }
  .sw { display: inline-block; width: 18px; height: 3px; margin-right: 4px; vertical-align: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 4px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Napoleon comparison</h1>
  <p id="sub"></p>
</header>
<main>
  <section>
    <div class="tabs" id="tabs" role="group" aria-label="Chart series"></div>
    <svg id="chart" role="img" aria-label="Chosen series over turns, one line per run"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <section><table id="table"></table></section>
</main>
<script>
const COMPARE = /*COMPARE_DATA*/null;
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, text) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
};
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const color = (i) => css(`--c${i % 6}`);
const money = (v) => (v === 0 ? "$0" : v < 0.01 ? "$" + v.toPrecision(2) : "$" + v.toFixed(2));
const runs = COMPARE.runs;
const SERIES = [["score", "Score"], ["cities", "Cities"], ["population", "Population"], ["techs", "Techs"], ["cost", "Cost"], ["calls", "Model calls"]];
const anyCalls = runs.some((r) => r.totals.llm_calls > 0);
const available = SERIES.filter(([k]) => (k !== "cost" && k !== "calls") || anyCalls);
let series = "score";

function drawChart() {
  const svg = $("chart");
  const W = svg.clientWidth || 800, H = 280, P = 36;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  const lines = runs.map((r) => r.series[series] || []).filter((s) => s.length);
  if (!lines.length) return;
  const all = lines.flat();
  const t0 = Math.min(...all.map((p) => p[0])), t1 = Math.max(...all.map((p) => p[0])), vmax = Math.max(1e-9, ...all.map((p) => p[1]));
  const fmt = (v) => (series === "cost" ? money(v) : Number.isInteger(v) ? String(v) : v.toFixed(1));
  const X = (t) => P + (W - 2 * P) * (t - t0) / Math.max(1, t1 - t0);
  const Y = (v) => H - P + 8 - (H - 2 * P) * v / vmax;
  svg.appendChild(el("line", { x1: P, y1: Y(0), x2: W - P, y2: Y(0), stroke: css("--line") }));
  svg.appendChild(el("text", { x: P - 4, y: Y(vmax) + 4, "text-anchor": "end", "font-size": 10, fill: css("--muted") }, fmt(vmax)));
  svg.appendChild(el("text", { x: P - 4, y: Y(0) + 4, "text-anchor": "end", "font-size": 10, fill: css("--muted") }, fmt(0)));
  svg.appendChild(el("text", { x: W - P, y: H - 6, "text-anchor": "end", "font-size": 10, fill: css("--muted") }, `turn ${t1}`));
  runs.forEach((r, i) => {
    const s = r.series[series] || [];
    if (s.length) svg.appendChild(el("polyline", { points: s.map(([t, v]) => `${X(t)},${Y(v)}`).join(" "), fill: "none", stroke: color(i), "stroke-width": 2 }));
  });
}

function drawTabs() {
  const box = $("tabs");
  box.replaceChildren();
  for (const [key, label] of available) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(key === series));
    b.addEventListener("click", () => { series = key; drawTabs(); drawChart(); });
    box.appendChild(b);
  }
}

$("title").textContent = `Comparing ${runs.length} run${runs.length === 1 ? "" : "s"}`;
$("sub").textContent = "Lines are per-turn series for each run. Costs are cumulative.";
runs.forEach((r, i) => {
  const item = document.createElement("span");
  const sw = document.createElement("i");
  sw.className = "sw";
  sw.style.background = color(i);
  item.append(sw, r.label);
  $("legend").appendChild(item);
});
const cols = [["Run", (r) => r.label], ["Score", (r) => r.totals.final_score], ["Cities", (r) => r.cities], ["Techs", (r) => r.techs],
  ["Illegal", (r) => `${(r.totals.illegal_action_rate * 100).toFixed(0)}%`], ["Steps", (r) => r.totals.steps],
  ["Model calls", (r) => r.totals.llm_calls], ["Tokens in/out", (r) => `${r.totals.input_tokens}/${r.totals.output_tokens}`],
  ["Cost", (r) => money(r.totals.cost_usd)], ["Ended", (r) => r.ended || "cut off"]];
const head = document.createElement("tr");
for (const [name] of cols) { const th = document.createElement("th"); th.textContent = name; head.appendChild(th); }
$("table").appendChild(head);
for (const r of runs) {
  const tr = document.createElement("tr");
  for (const [, get] of cols) { const td = document.createElement("td"); td.textContent = get(r); tr.appendChild(td); }
  $("table").appendChild(tr);
}
addEventListener("resize", drawChart);
drawTabs();
drawChart();
</script>
</body>
</html>
