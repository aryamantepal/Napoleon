[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "napoleon"
version = "0.0.1"
description = "A testbed comparing agent architectures on Civilization VI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Real Civ VI. Pinned to the civ6-mcp commit the backend was checked against.
civ6 = ["civ6-mcp @ git+https://github.com/lmwilki/civ6-mcp@dd20190 ; python_version >= '3.12'"]

[project.scripts]
napoleon = "napoleon.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/napoleon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
